# VoltGuard — Domain Thresholds Configuration
# All fault detection thresholds in one place.
# Changing a value here changes behavior system-wide — no code edits needed.

battery:
  # State of Charge
  soc_low: 25.0          # Below this → Low SOC fault
  soc_critical: 10.0     # Below this → Critical, immediate shutdown

  # Voltage (Volts)
  voltage_low: 36.0      # Below this → Under-voltage fault
  voltage_high: 50.5     # Above this → Over-voltage fault
  voltage_critical_low: 30.0

  # Temperature (°C)
  temp_high: 60.0        # Above this → Over-temperature fault
  temp_low: 5.0          # Below this → Under-temperature fault
  temp_critical_high: 75.0
  temp_critical_low: -10.0

  # Aging
  charging_cycles_warn: 600   # Above this → Aging warning
  charging_cycles_critical: 800  # Above this → Aging fault

motor:
  # Current (Amps)
  current_overcurrent: 50.0    # Above this → Motor overcurrent
  current_critical: 80.0

  # RPM
  rpm_overspeed: 9000.0        # Above this → Abnormal RPM
  rpm_critical: 11000.0

# Self-healing effect parameters
healing:
  cooling_rate: 2.0            # °C reduction per tick when cooling active
  cooling_duration: 5          # Number of ticks cooling stays active
  throttle_rpm_reduction: 0.3  # Fraction to reduce RPM by
  throttle_current_reduction: 0.4
  recharge_soc_rate: 5.0       # SOC % increase per tick when charging
  preheat_rate: 1.5            # °C increase per tick when preheating

# Simulation defaults
simulation:
  tick_interval_seconds: 1.0
  default_num_vehicles: 5
  default_num_ticks: 100

# Model training
model:
  test_split: 0.2
  random_state: 42
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.1
